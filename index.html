<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin2Dec</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="container-app">
    <h1 class="app-title">Bin2Dec</h1>
    <form class="app-form">
      <label for="binarie-entry" class="app-label">Ingresa un numero binario:</label>
      <input id="binarie-entry" class="app-input" type="text" maxlength="8" pattern="[0-1]*" placeholder="Ej: 01010110" required>
      <div class="btns">
        <button type="submit" class="app-btn" id="calc-btn">Calcular</button>
        <button type="button" class="app-btn" id="reset-btn">Reset</button>
      </div>
      <output class="app-output">
        <p>Tu resultado es:</p>
        <p class="output-text"></p>
      </output> 
    </form>
  </main>
</body>
</html>
